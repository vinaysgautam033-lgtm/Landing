<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette Roulette</title>
<style>
  :root { --bg:#f3f1ee; --ink:#1d1b1a; --muted:#6b6560; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161514; --ink:#f1eeea; --muted:#9a948d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 20px 24px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); font-size: .95rem; }
  main { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin: 12px 24px; border-radius: 18px; overflow: hidden; min-height: 320px; }
  .sw {
    border: 0; cursor: pointer; font: inherit; display: flex; align-items: flex-end; justify-content: center;
    padding: 20px 8px; transition: flex .2s; font-weight: 700; font-size: 1.05rem;
  }
  .sw:focus-visible { outline: 3px solid var(--ink); outline-offset: -6px; }
  footer { padding: 8px 24px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button.go {
    background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
    padding: 12px 24px; font: inherit; font-weight: 700; cursor: pointer;
  }
  button.go:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
  #msg { min-height: 1.2em; }
  @media (max-width: 600px) {
    main { grid-template-columns: 1fr; margin: 12px; }
    .sw { padding: 18px; align-items: center; justify-content: flex-start; }
  }
</style>
</head>
<body>
<header>
  <h1>Palette Roulette</h1>
  <p>Press space or tap the button for a new palette. Click a color to copy it.</p>
</header>
<main id="board" aria-live="polite"></main>
<footer>
  <button class="go" id="spin">New palette</button>
  <p id="msg"></p>
</footer>
<script>
  var board = document.getElementById('board');
  var msg = document.getElementById('msg');

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var a = s * Math.min(l, 1 - l);
    function f(n) {
      var k = (n + h / 30) % 12;
      var c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * c).toString(16).padStart(2, '0');
    }
    return '#' + f(0) + f(8) + f(4);
  }

  function textOn(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#1d1b1a' : '#ffffff';
  }

  function spin() {
    var base = Math.random() * 360;
    var spread = 25 + Math.random() * 50;
    board.innerHTML = '';
    for (var i = 0; i < 5; i++) {
      var hex = hslToHex((base + i * spread) % 360, 45 + Math.random() * 35, 30 + i * 11 + Math.random() * 6);
      var b = document.createElement('button');
      b.className = 'sw';
      b.style.background = hex;
      b.style.color = textOn(hex);
      b.textContent = hex;
      b.setAttribute('aria-label', 'Copy ' + hex);
      b.addEventListener('click', (function (h) {
        return function () {
          try { navigator.clipboard.writeText(h); msg.textContent = 'Copied ' + h; }
          catch (e) { msg.textContent = 'Copy this: ' + h; }
        };
      })(hex));
      board.appendChild(b);
    }
    msg.textContent = '';
  }

  document.getElementById('spin').addEventListener('click', spin);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); spin(); }
  });
  spin();
</script>
</body>
</html>
